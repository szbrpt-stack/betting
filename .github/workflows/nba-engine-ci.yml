name: NBA engine CI
on:
  push:
    branches: [feature/nba-engine]
  pull_request:
    paths:
      - "nba-engine/**"
      - ".github/workflows/nba-engine-ci.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nba-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Personal research v0.1 and v0.2 backtests
        if: github.event_name == 'push'
        run: |
          python download_games.py --out data/games.csv
          python -m nba_engine.pipeline --csv data/games.csv --out outputs/v01
          python -m nba_engine.v02 --csv data/games.csv --out outputs/v02
          python -m nba_engine.audit --csv data/games.csv --predictions outputs/v02/predictions.csv --out outputs/audit
          python -m nba_engine.reliability --predictions outputs/v02/predictions.csv --out outputs/reliability
          python -m nba_engine.recalibration --predictions outputs/v02/predictions.csv --out outputs/recalibration
      - name: Upload evaluation metrics (no third-party data)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nba-evaluation-metrics
          path: |
            nba-engine/outputs/v01/metrics.json
            nba-engine/outputs/v02/metrics.json
            nba-engine/outputs/audit/audit.json
            nba-engine/outputs/audit/coverage.csv
            nba-engine/outputs/audit/calibration.csv
            nba-engine/outputs/reliability/reliability.json
            nba-engine/outputs/reliability/season_bins.csv
            nba-engine/outputs/reliability/season_calibration.csv
            nba-engine/outputs/recalibration/metrics.json
            nba-engine/outputs/recalibration/folds.csv
          if-no-files-found: error
          retention-days: 7
