name: NBA engine CI
on:
  push:
    branches: [feature/nba-engine]
  pull_request:
    paths:
      - "nba-engine/**"
      - ".github/workflows/nba-engine-ci.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nba-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
