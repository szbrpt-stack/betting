name: NBA engine CI
on:
  push:
    branches: [feature/nba-engine]
  pull_request:
    paths:
      - "nba-engine/**"
      - ".github/workflows/nba-engine-ci.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nba-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Personal research backtest
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python download_games.py --out data/games.csv
          python -m nba_engine.pipeline --csv data/games.csv --out outputs
      - name: Upload evaluation metrics (no third-party data)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nba-evaluation-metrics
          path: nba-engine/outputs/metrics.json
          if-no-files-found: ignore
          retention-days: 7
