services:
  - type: web
    name: propsbr-aggregator
    env: python
    plan: free
    buildCommand: pip install -r backend-data-engine/requirements.txt
    startCommand: cd backend-data-engine && gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 8000
